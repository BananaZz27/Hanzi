<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แฟลชการ์ดภาษาจีน</title>
<meta name="theme-color" content="#1f4fa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="汉字卡">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Blue-and-white porcelain: pale glaze ground, cobalt ink, seal red reserved for "forgot".
   Layout: one narrow column, phone-first; study screen is a single card with grade bar beneath. */
:root{
  --glaze:#f3f6fa;
  --paper:#ffffff;
  --ink:#16233b;
  --muted:#5d6b82;
  --line:#d8e0ec;
  --cobalt:#1f4fa8;
  --cobalt-soft:#e3ebf8;
  --seal:#b8322a;
  --seal-soft:#f8e4e2;
  --jade:#2f7d5b;
  --jade-soft:#e0f1e8;
  --amber:#a5670f;
  --amber-soft:#f6ecd9;
  --font-hanzi:"Noto Serif SC","Songti SC","SimSun",serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --glaze:#0e1626; --paper:#162238; --ink:#e7edf7; --muted:#9aa8c0; --line:#2a3a56;
    --cobalt:#7fa6ee; --cobalt-soft:#1f3150; --seal:#ef8a80; --seal-soft:#3a2124;
    --jade:#79c9a2; --jade-soft:#17352a; --amber:#e3b062; --amber-soft:#3a2e17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --glaze:#0e1626; --paper:#162238; --ink:#e7edf7; --muted:#9aa8c0; --line:#2a3a56;
  --cobalt:#7fa6ee; --cobalt-soft:#1f3150; --seal:#ef8a80; --seal-soft:#3a2124;
  --jade:#79c9a2; --jade-soft:#17352a; --amber:#e3b062; --amber-soft:#3a2e17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--glaze);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.15rem;font-weight:600}
.hz{font-family:var(--font-hanzi)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px;border-radius:8px;background:var(--cobalt);color:var(--paper);display:grid;place-items:center;font-family:var(--font-hanzi);font-size:1.5rem;font-weight:700;flex:none}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--cobalt)}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--paper)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--cobalt);padding:8px 10px}
.btn.danger{color:var(--seal)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.due b{color:var(--cobalt)}
.deck{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%}
.deck:hover{border-color:var(--cobalt)}
.deck .glyph{font-family:var(--font-hanzi);font-size:1.6rem;width:52px;height:52px;border-radius:10px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;flex:none}
.deck .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.deck .meta strong{font-weight:600;overflow-wrap:anywhere}
.pill{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--jade-soft);color:var(--jade)}
.pill.new{background:var(--amber-soft);color:var(--amber)}
.list{display:flex;flex-direction:column;gap:10px}
label{font-weight:500;font-size:.92rem}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--cobalt);border-color:var(--cobalt);color:var(--paper)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;cursor:pointer;min-height:42px}
.seg button.on{background:var(--cobalt);color:var(--paper)}
.note{border-radius:10px;padding:10px 12px;font-size:.9rem}
.note.err{background:var(--seal-soft);color:var(--seal)}
.note.info{background:var(--cobalt-soft);color:var(--cobalt)}
.word{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .zh{font-family:var(--font-hanzi);font-size:1.4rem;min-width:64px}
.word .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.word .tx span{overflow-wrap:anywhere}
.icon{border:0;background:transparent;cursor:pointer;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon:hover{background:var(--cobalt-soft);color:var(--cobalt)}
.icon svg{width:20px;height:20px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cobalt);transition:width .25s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 20px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer;box-shadow:0 10px 30px -18px rgba(22,35,59,.35);position:relative}
.card .front-zh{font-family:var(--font-hanzi);font-size:clamp(3.2rem,16vw,5rem);line-height:1.15;font-weight:500;overflow-wrap:anywhere}
.card .front-th{font-size:1.6rem;font-weight:600}
.card .pinyin{font-size:1.35rem;color:var(--cobalt);font-weight:500}
.card .mean{font-size:1.25rem;font-weight:600}
.card .pos{font-size:.8rem;color:var(--muted)}
.card hr{width:56px;border:0;border-top:2px solid var(--line);margin:4px 0}
.card .ex{display:flex;flex-direction:column;gap:2px;max-width:42ch}
.card .ex .hz{font-size:1.15rem}
.card .hint{font-size:.85rem;color:var(--muted)}
.card .say{position:absolute;top:10px;right:10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
.grade b{font-weight:600}
.grade small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grade.g0{background:var(--seal-soft);border-color:transparent}.grade.g0 b{color:var(--seal)}
.grade.g1{background:var(--amber-soft);border-color:transparent}.grade.g1 b{color:var(--amber)}
.grade.g2{background:var(--cobalt-soft);border-color:transparent}.grade.g2 b{color:var(--cobalt)}
.grade.g3{background:var(--jade-soft);border-color:transparent}.grade.g3 b{color:var(--jade)}
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 0}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--cobalt);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.dots i{animation:none;opacity:.7}.progress i{transition:none}}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,32,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--paper);border-radius:14px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:12px 0}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div id="modal"></div>

<script>
(function(){
"use strict";

/* ---------- config: put your Cloudflare Worker URL here ---------- */
const API_URL = "https://hanzi-api.watanyu376.workers.dev";

/* ---------- constants ---------- */
const DAY = 86400000;
const NEW_PER_SESSION = 10;
const LOCAL_KEY = "hanzi-cards-v1";
const PREF_KEY = "hanzi-cards-prefs";
const TOPICS = ["ทักทาย","ตัวเลขและเวลา","ครอบครัว","อาหารและเครื่องดื่ม","สั่งอาหารในร้าน","ช้อปปิ้งต่อราคา","การเดินทาง","สนามบิน","โรงแรม","สีและเสื้อผ้า","ร่างกายและสุขภาพ","ที่ทำงาน","โรงเรียน","อารมณ์ความรู้สึก","สภาพอากาศ","คำกริยาพื้นฐาน"];
const LEVELS = ["HSK 1","HSK 2","HSK 3","HSK 4","HSK 5","HSK 6"];

const SAMPLE = {
  id:"sample-greet", title:"คำทักทาย (ตัวอย่าง)", topic:"ทักทาย", level:"HSK 1", createdAt:0, sample:true,
  cards:[
    ["你好","nǐ hǎo","สวัสดี","คำทักทาย","你好，我叫小明。","Nǐ hǎo, wǒ jiào Xiǎomíng.","สวัสดี ฉันชื่อเสี่ยวหมิง"],
    ["谢谢","xièxie","ขอบคุณ","คำกริยา","谢谢你的帮助。","Xièxie nǐ de bāngzhù.","ขอบคุณสำหรับความช่วยเหลือ"],
    ["不客气","bú kèqi","ไม่ต้องเกรงใจ / ยินดี","วลี","不客气，这是小事。","Bú kèqi, zhè shì xiǎoshì.","ไม่ต้องเกรงใจ เรื่องเล็กน้อย"],
    ["对不起","duìbuqǐ","ขอโทษ","วลี","对不起，我来晚了。","Duìbuqǐ, wǒ lái wǎn le.","ขอโทษ ฉันมาสาย"],
    ["没关系","méi guānxi","ไม่เป็นไร","วลี","没关系，别担心。","Méi guānxi, bié dānxīn.","ไม่เป็นไร ไม่ต้องกังวล"],
    ["再见","zàijiàn","ลาก่อน","คำทักทาย","明天见！再见！","Míngtiān jiàn! Zàijiàn!","พรุ่งนี้เจอกัน ลาก่อน"],
    ["早上好","zǎoshang hǎo","อรุณสวัสดิ์","คำทักทาย","老师，早上好！","Lǎoshī, zǎoshang hǎo!","อรุณสวัสดิ์ครับคุณครู"],
    ["请","qǐng","เชิญ / กรุณา","คำกริยา","请坐。","Qǐng zuò.","เชิญนั่ง"],
    ["名字","míngzi","ชื่อ","คำนาม","你叫什么名字？","Nǐ jiào shénme míngzi?","คุณชื่ออะไร"],
    ["认识","rènshi","รู้จัก","คำกริยา","很高兴认识你。","Hěn gāoxìng rènshi nǐ.","ยินดีที่ได้รู้จัก"]
  ].map((c,i)=>({id:"s"+i,hanzi:c[0],pinyin:c[1],thai:c[2],pos:c[3],example:c[4],examplePinyin:c[5],exampleThai:c[6]}))
};

/* ---------- state ---------- */
const S = {
  view:"home", deckId:null,
  decks:{}, loaded:false, storeNote:"", flash:"",
  prefs:loadPrefs(),
  create:{topic:"",level:"HSK 1",count:10,busy:false,err:"",addTo:null},
  study:null,
  sampleHidden:false
};

function loadPrefs(){
  try{ const p=JSON.parse(localStorage.getItem(PREF_KEY)||"{}"); return {front:p.front==="th"?"th":"zh"}; }catch(e){ return {front:"zh"}; }
}
function savePrefs(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify(S.prefs)); }catch(e){} }

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const ICON = {
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>'
};

function deckList(){
  let list = Object.values(S.decks);
  if(S.loaded && list.length===0 && !S.sampleHidden){ S.decks[SAMPLE.id]=clone(SAMPLE); list=[S.decks[SAMPLE.id]]; }
  return list.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
}
function counts(deck, now){
  now = now||Date.now(); let due=0, fresh=0, learned=0;
  for(const c of deck.cards){ if(!c.srs) fresh++; else { learned++; if(c.srs.due<=now) due++; } }
  return {due, fresh, learned, total:deck.cards.length};
}

/* ---------- spaced repetition (SM-2 style) ---------- */
function schedule(srs, g, now){
  const s = srs ? Object.assign({},srs) : {reps:0,interval:0,ease:2.5,lapses:0};
  if(g===0){
    s.reps=0; s.interval=0; s.ease=Math.max(1.3,s.ease-0.2); s.lapses=(s.lapses||0)+1; s.due=now+60000;
    return s;
  }
  let iv;
  if(s.reps===0) iv={1:1,2:1,3:4}[g];
  else if(s.reps===1) iv={1:2,2:3,3:6}[g];
  else{
    const base=Math.max(1,s.interval), good=base*s.ease;
    iv = g===1 ? base*1.2 : g===2 ? good : good*1.3;
    iv = Math.max(base+(g>1?1:0), Math.round(iv));
  }
  if(g===1) s.ease=Math.max(1.3,s.ease-0.15);
  if(g===3) s.ease=s.ease+0.15;
  s.interval=iv; s.reps++; s.due=now+iv*DAY;
  return s;
}
function ivLabel(srs,g){
  if(g===0) return "1 นาที";
  const d=schedule(srs,g,0).interval;
  if(d<30) return d+" วัน";
  if(d<365) return Math.round(d/30)+" เดือน";
  return (d/365).toFixed(1)+" ปี";
}

/* ---------- storage (this browser only) ---------- */
let localTimer=null;
function bodyOf(d){
  return {title:d.title, topic:d.topic||"", level:d.level||"", createdAt:d.createdAt||Date.now(), updatedAt:d.updatedAt||Date.now(), cards:d.cards};
}
function saveDeck(id){
  const d=S.decks[id]; if(!d) return;
  if(d.sample){ d.sample=false; d.title=d.title.replace(" (ตัวอย่าง)",""); d.createdAt=Date.now(); }
  d.updatedAt=Date.now();
  clearTimeout(localTimer);
  localTimer=setTimeout(saveLocal, 300);
}
function removeDeck(id){
  const was=S.decks[id]; delete S.decks[id];
  if(was && was.sample){ S.sampleHidden=true; return; }
  saveLocal();
}
function saveLocal(){
  try{
    const out={}; for(const [k,d] of Object.entries(S.decks)) if(!d.sample) out[k]=bodyOf(d);
    localStorage.setItem(LOCAL_KEY, JSON.stringify(out));
  }catch(e){ S.storeNote="เบราว์เซอร์นี้เก็บข้อมูลไม่ได้ (อาจเปิดโหมดไม่ระบุตัวตนอยู่) ความคืบหน้าจะหายเมื่อปิดหน้า"; if(S.view!=="study") render(); }
}
function loadLocal(){
  try{
    const raw=JSON.parse(localStorage.getItem(LOCAL_KEY)||"{}");
    for(const [k,d] of Object.entries(raw)) if(d && Array.isArray(d.cards)) S.decks[k]=Object.assign({id:k},d);
  }catch(e){}
  S.loaded=true;
}
function exportData(){
  const out={app:"hanzi-cards",version:1,exportedAt:new Date().toISOString(),decks:{}};
  for(const [k,d] of Object.entries(S.decks)) if(!d.sample) out.decks[k]=bodyOf(d);
  const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="hanzi-cards-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const decks=data && data.decks; if(!decks || typeof decks!=="object") throw 0;
      let n=0;
      for(const [k,d] of Object.entries(decks)){
        if(!d || !Array.isArray(d.cards) || typeof d.title!=="string") continue;
        S.decks[k]=Object.assign({id:k},d); n++;
      }
      if(!n) throw 0;
      saveLocal(); S.flash="นำเข้า "+n+" ชุดคำแล้ว";
    }catch(e){ S.flash="ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอพนี้"; }
    S.view="home"; render();
  };
  r.readAsText(file);
}

/* ---------- speech ---------- */
const hasWebSpeech = typeof window.speechSynthesis!=="undefined" && typeof window.SpeechSynthesisUtterance!=="undefined";
function canSpeak(){ return hasWebSpeech; }
async function speak(text){
  if(!text) return;
  if(hasWebSpeech){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=0.85;
      const v=speechSynthesis.getVoices().find(v=>/^zh(-|_)?(CN|Hans)?/i.test(v.lang));
      if(v) u.voice=v;
      speechSynthesis.speak(u);
    }catch(e){}
  }
}

/* ---------- AI (Gemini through your Cloudflare Worker) ---------- */
async function callApi(topic, level, count, exclude){
  if(!API_URL || API_URL.indexOf("YOUR-")>=0) throw {code:"no_api"};
  let res;
  try{
    res=await fetch(API_URL.replace(/\/$/,"")+"/generate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({topic, level, count, exclude:exclude.slice(-300)})});
  }catch(e){ throw {code:"network"}; }
  let data=null; try{ data=await res.json(); }catch(e){}
  if(res.status===429) throw {code:"rate_limited"};
  if(!res.ok || !data) throw {code:(data&&data.error)||"server"};
  return data;
}
function cleanCards(raw, existing){
  const have=new Set(existing);
  const out=[];
  for(const c of (raw&&Array.isArray(raw.cards))?raw.cards:[]){
    if(!c || typeof c.hanzi!=="string" || typeof c.thai!=="string") continue;
    const hz=c.hanzi.trim(); if(!hz || have.has(hz)) continue;
    have.add(hz);
    out.push({id:uid("c"),hanzi:hz,pinyin:String(c.pinyin||"").trim(),thai:c.thai.trim(),pos:String(c.pos||"").trim(),
      example:String(c.example||"").trim(),examplePinyin:String(c.examplePinyin||"").trim(),exampleThai:String(c.exampleThai||"").trim()});
  }
  return out;
}
async function generate(){
  const C=S.create;
  const topic=C.topic.trim();
  if(!topic){ C.err="พิมพ์หัวข้อหรือเลือกจากรายการก่อน"; render(); return; }
  const target = C.addTo ? S.decks[C.addTo] : null;
  const existing = target ? target.cards.map(c=>c.hanzi) : [];
  C.busy=true; C.err=""; render();
  try{
    const raw=await callApi(topic, C.level, C.count, existing);
    const cards=cleanCards(raw, existing);
    if(cards.length===0) throw {code:"bad_output"};
    let id;
    if(target){
      target.cards=target.cards.concat(cards); id=target.id; saveDeck(id);
    }else{
      id=uid("d");
      const title=(raw && typeof raw.title==="string" && raw.title.trim()) || topic;
      S.decks[id]={id,title:title.slice(0,60),topic,level:C.level,createdAt:Date.now(),updatedAt:Date.now(),cards};
      saveDeck(id);
    }
    C.busy=false; C.topic=""; C.addTo=null;
    S.deckId=id; S.view="deck"; S.flash="เพิ่ม "+cards.length+" คำแล้ว";
    render();
  }catch(e){
    C.busy=false;
    const code=e&&e.code;
    C.err = code==="no_api" ? "ยังไม่ได้ตั้งค่า API_URL ในไฟล์ index.html"
      : code==="forbidden_origin" ? "Worker ไม่อนุญาตเว็บนี้ ตรวจค่า ALLOWED_ORIGIN ใน Cloudflare"
      : code==="network" ? "ต่ออินเทอร์เน็ตไม่ได้ ตรวจการเชื่อมต่อแล้วลองใหม่"
      : code==="rate_limited" ? "ตอนนี้มีคนใช้ AI เยอะ รอประมาณหนึ่งนาทีแล้วลองใหม่"
      : code==="quota" ? "โควตา AI ของวันนี้หมดแล้ว ลองใหม่พรุ่งนี้ ระหว่างนี้ยังทบทวนชุดคำเดิมได้"
      : code==="bad_output" ? "AI ตอบกลับมาไม่ครบ ลองกดสร้างอีกครั้ง"
      : "สร้างชุดคำไม่สำเร็จ ลองอีกครั้ง";
    render();
  }
}

/* ---------- study ---------- */
function startStudy(id, all){
  const d=S.decks[id]; if(!d) return;
  const now=Date.now();
  let q;
  if(all) q=shuffle(d.cards.map(c=>c.id));
  else{
    const due=shuffle(d.cards.filter(c=>c.srs && c.srs.due<=now).map(c=>c.id));
    const fresh=d.cards.filter(c=>!c.srs).slice(0,NEW_PER_SESSION).map(c=>c.id);
    q=due.concat(fresh);
  }
  if(!q.length) return;
  S.study={deckId:id, queue:q, total:q.length, doneIds:new Set(), flipped:false, tally:[0,0,0,0], all:!!all};
  S.view="study"; render();
}
function currentCard(){
  const st=S.study; if(!st) return null;
  const d=S.decks[st.deckId]; if(!d) return null;
  return d.cards.find(c=>c.id===st.queue[0])||null;
}
function grade(g){
  const st=S.study, c=currentCard(); if(!st||!c||!st.flipped) return;
  c.srs=schedule(c.srs,g,Date.now());
  st.tally[g]++;
  const id=st.queue.shift();
  if(g===0){ st.queue.splice(Math.min(3,st.queue.length),0,id); }
  else st.doneIds.add(id);
  st.flipped=false;
  saveDeck(st.deckId);
  if(!st.queue.length){ S.view="done"; }
  render();
}

/* ---------- views ---------- */
function speakerBtn(text,label){
  if(!canSpeak()) return "";
  return '<button class="icon" data-act="speak" data-text="'+esc(text)+'" aria-label="'+esc(label||"ฟังเสียง")+'">'+ICON.speak+'</button>';
}
function storeNoteHtml(){
  let h="";
  if(S.storeNote) h+='<div class="note err">'+esc(S.storeNote)+'</div>';
  return h;
}

function viewHome(){
  const decks=deckList(); const now=Date.now();

  h+=storeNoteHtml();
  if(!S.loaded){
    return h+'<div class="loader"><div class="dots"><i></i><i></i><i></i></div><div class="muted">กำลังโหลดชุดคำ</div></div>';
  }
  h+='<section class="summary" aria-label="สรุปวันนี้">'+
    '<div class="stat due"><b>'+due+'</b><span>ถึงรอบทบทวน</span></div>'+
    '<div class="stat"><b>'+learned+'</b><span>คำที่เริ่มจำแล้ว</span></div>'+
    '<div class="stat"><b>'+total+'</b><span>คำทั้งหมด</span></div></section>';
  if(S.flash){ h+='<div class="note info">'+esc(S.flash)+'</div>'; S.flash=""; }
  h+='<button class="btn primary block" data-act="new">＋ สร้างชุดคำใหม่ด้วย AI</button>';
  h+='<div class="spread"><h2>ชุดคำของฉัน</h2><div class="seg" role="group" aria-label="ด้านหน้าการ์ด" style="width:180px">'+
    '<button data-act="front" data-v="zh" class="'+(S.prefs.front==="zh"?"on":"")+'" aria-pressed="'+(S.prefs.front==="zh")+'"><span class="hz">汉</span> → ไทย</button>'+
    '<button data-act="front" data-v="th" class="'+(S.prefs.front==="th"?"on":"")+'" aria-pressed="'+(S.prefs.front==="th")+'">ไทย → <span class="hz">汉</span></button></div></div>';
  if(!decks.length){
    h+='<div class="panel empty muted">ยังไม่มีชุดคำ กดปุ่มด้านบนเพื่อให้ AI สร้างให้</div>';
  }
  h+='<div class="list">';
  for(const d of decks){
    const k=counts(d,now);
    const pill = k.due ? '<span class="pill">ทบทวน '+k.due+'</span>' : k.fresh ? '<span class="pill new">ใหม่ '+k.fresh+'</span>' : '<span class="pill done">ครบแล้ว</span>';
    h+='<button class="deck" data-act="open" data-id="'+esc(d.id)+'"><span class="glyph" aria-hidden="true">'+esc((d.cards[0]&&d.cards[0].hanzi||"字").slice(0,1))+'</span>'+
      '<span class="meta"><strong>'+esc(d.title)+'</strong><span class="muted small">'+esc(d.level||"")+' · '+k.total+' คำ</span></span>'+pill+'</button>';
  }
  h+='</div>';
  h+='<footer class="panel small"><div class="muted">ชุดคำและความคืบหน้าเก็บไว้ในเครื่องนี้เท่านั้น สำรองไว้ก่อนล้างเบราว์เซอร์หรือย้ายเครื่อง</div>'+
    '<div class="row"><button class="btn" style="flex:1" data-act="export">สำรองข้อมูล</button>'+
    '<label class="btn" style="flex:1" for="importfile">นำเข้าไฟล์สำรอง</label><input type="file" id="importfile" accept="application/json,.json" hidden></div></footer>';
  return h;
}

function viewDeck(){
  const d=S.decks[S.deckId]; if(!d){ S.view="home"; return viewHome(); }
  const k=counts(d);
  const reviewN=k.due+Math.min(k.fresh,NEW_PER_SESSION);
  let h='<div class="spread"><button class="btn ghost" data-act="home">'+ICON.back+' กลับ</button>'+
    '<button class="btn ghost danger" data-act="askdel">ลบชุดนี้</button></div>';
  h+='<div><h1>'+esc(d.title)+'</h1><div class="muted small">'+esc(d.level||"")+(d.topic?' · หัวข้อ: '+esc(d.topic):'')+'</div></div>';
  if(S.flash){ h+='<div class="note info">'+esc(S.flash)+'</div>'; S.flash=""; }
  h+=storeNoteHtml();
  h+='<section class="summary"><div class="stat due"><b>'+k.due+'</b><span>ถึงรอบ</span></div><div class="stat"><b>'+k.fresh+'</b><span>คำใหม่</span></div><div class="stat"><b>'+k.learned+'</b><span>เริ่มจำแล้ว</span></div></section>';
  h+='<div class="row">'+
    '<button class="btn primary" style="flex:2" data-act="study" '+(reviewN?'':'disabled')+'>'+(reviewN?'เริ่มทบทวน '+reviewN+' คำ':'วันนี้ครบแล้ว')+'</button>'+
    '<button class="btn" style="flex:1" data-act="cram">ฝึกทั้งหมด</button></div>';
  h+='<button class="btn block" data-act="more">＋ ให้ AI เพิ่มคำในชุดนี้</button>';
  h+='<section class="panel" aria-label="รายการคำ"><div class="spread"><h2>คำในชุด</h2><span class="muted small">'+k.total+' คำ</span></div><div>';
  for(const c of d.cards){
    const st = !c.srs ? '<span class="pill new">ใหม่</span>' : c.srs.due<=Date.now() ? '<span class="pill">ถึงรอบ</span>' : '<span class="pill done">อีก '+Math.max(1,Math.ceil((c.srs.due-Date.now())/DAY))+' วัน</span>';
    h+='<div class="word"><span class="zh">'+esc(c.hanzi)+'</span><span class="tx"><span style="color:var(--cobalt)">'+esc(c.pinyin)+'</span><span>'+esc(c.thai)+'</span></span>'+st+
      speakerBtn(c.hanzi,"ฟังเสียง "+c.hanzi)+'<button class="icon" data-act="delword" data-id="'+esc(c.id)+'" aria-label="ลบคำ '+esc(c.hanzi)+'">'+ICON.trash+'</button></div>';
  }
  h+='</div></section>';
  return h;
}

function viewCreate(){
  const C=S.create; const target=C.addTo?S.decks[C.addTo]:null;
  let h='<div class="spread"><button class="btn ghost" data-act="'+(target?'backdeck':'home')+'">'+ICON.back+' กลับ</button></div>';
  h+='<div><h1>'+(target?'เพิ่มคำใน “'+esc(target.title)+'”':'สร้างชุดคำด้วย AI')+'</h1><div class="muted small">บอกหัวข้อ แล้ว AI จะเลือกคำ พินอิน คำแปล และประโยคตัวอย่างให้</div></div>';
  if(C.busy){
    return h+'<div class="panel loader"><div class="dots"><i></i><i></i><i></i></div><div>AI กำลังเลือก '+C.count+' คำเรื่อง “'+esc(C.topic)+'”</div><div class="muted small">ใช้เวลาประมาณ 10–30 วินาที</div></div>';
  }
  h+='<form class="panel" id="cform">';
  h+='<div class="field"><label for="topic">หัวข้อ</label><input type="text" id="topic" maxlength="80" placeholder="เช่น ผลไม้ หรือ คำที่ใช้ในร้านกาแฟ" value="'+esc(C.topic)+'"></div>';
  h+='<div class="chips" role="group" aria-label="หัวข้อแนะนำ">'+TOPICS.map(t=>'<button type="button" class="chip'+(C.topic===t?' on':'')+'" data-act="topic" data-v="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>';
  h+='<div class="row"><div class="field" style="flex:1;min-width:140px"><label for="level">ระดับ</label><select id="level">'+LEVELS.map(l=>'<option'+(C.level===l?' selected':'')+'>'+l+'</option>').join("")+'</select></div>';
  h+='<div class="field" style="flex:1;min-width:160px"><label id="cnt-l">จำนวนคำ</label><div class="seg" role="group" aria-labelledby="cnt-l">'+[10,20,30].map(n=>'<button type="button" data-act="count" data-v="'+n+'" class="'+(C.count===n?'on':'')+'" aria-pressed="'+(C.count===n)+'">'+n+'</button>').join("")+'</div></div></div>';
  if(C.err) h+='<div class="note err">'+esc(C.err)+'</div>';
  h+='<button class="btn primary block" type="submit">'+(target?'เพิ่มคำ':'สร้างชุดคำ')+'</button>';
  h+='</form>';
  return h;
}

function viewStudy(){
  const st=S.study, c=currentCard(), d=st&&S.decks[st.deckId];
  if(!st||!c||!d){ S.view="home"; return viewHome(); }
  const pct=Math.round(st.doneIds.size/st.total*100);
  const front=S.prefs.front;
  let h='<div class="spread"><button class="btn ghost" data-act="quit">'+ICON.back+' ออก</button><span class="muted small" style="font-variant-numeric:tabular-nums">'+st.doneIds.size+' / '+st.total+'</span></div>';
  h+='<div class="progress" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';
  h+='<div class="card" data-act="flip" role="button" tabindex="0" aria-label="'+(st.flipped?'การ์ดด้านหลัง':'แตะเพื่อดูคำตอบ')+'">';
  if(front==="zh" || st.flipped){
    h+='<div class="say">'+speakerBtn(c.hanzi)+'</div>';
  }
  if(front==="zh"){
    h+='<div class="front-zh">'+esc(c.hanzi)+'</div>';
    if(st.flipped){
      h+='<div class="pinyin">'+esc(c.pinyin)+'</div><div class="mean">'+esc(c.thai)+'</div>'+(c.pos?'<div class="pos">'+esc(c.pos)+'</div>':'');
    }
  }else{
    h+='<div class="front-th">'+esc(c.thai)+'</div>'+(c.pos?'<div class="pos">'+esc(c.pos)+'</div>':'');
    if(st.flipped) h+='<div class="front-zh">'+esc(c.hanzi)+'</div><div class="pinyin">'+esc(c.pinyin)+'</div>';
  }
  if(st.flipped && c.example){
    h+='<hr><div class="ex"><span class="hz">'+esc(c.example)+'</span><span class="muted small">'+esc(c.examplePinyin)+'</span><span class="small">'+esc(c.exampleThai)+'</span></div>';
  }
  if(!st.flipped) h+='<div class="hint">แตะการ์ดเพื่อดูคำตอบ</div>';
  h+='</div>';
  if(st.flipped){
    const labels=["ลืม","ยาก","จำได้","ง่าย"];
    h+='<div class="grades" role="group" aria-label="จำได้แค่ไหน">'+labels.map((l,g)=>'<button class="grade g'+g+'" data-act="grade" data-g="'+g+'"><b>'+l+'</b><small>'+ivLabel(c.srs,g)+'</small></button>').join("")+'</div>';
  }else{
    h+='<button class="btn primary block" data-act="flip">ดูคำตอบ</button>';
  }
  return h;
}

function viewDone(){
  const st=S.study; const d=st&&S.decks[st.deckId];
  const t=st?st.tally:[0,0,0,0];
  let h='<div class="panel" style="align-items:center;text-align:center;padding:28px 16px">'+
    '<div class="seal" style="width:64px;height:64px;font-size:2rem;background:var(--jade)" aria-hidden="true">好</div>'+
    '<h1>ทบทวนเสร็จแล้ว</h1><div class="muted">'+(st?st.total:0)+' คำ'+(d?' จากชุด “'+esc(d.title)+'”':'')+'</div>'+
    '<div class="row" style="justify-content:center">'+
      '<span class="pill" style="background:var(--seal-soft);color:var(--seal)">ลืม '+t[0]+'</span>'+
      '<span class="pill new">ยาก '+t[1]+'</span>'+
      '<span class="pill">จำได้ '+t[2]+'</span>'+
      '<span class="pill done">ง่าย '+t[3]+'</span></div>'+
    '<div class="muted small">คำที่ตอบว่าจำได้จะกลับมาให้ทบทวนตามรอบที่กำหนดไว้</div></div>';
  h+='<div class="row"><button class="btn" style="flex:1" data-act="backdeck">ดูชุดคำ</button><button class="btn primary" style="flex:1" data-act="home">หน้าแรก</button></div>';
  return h;
}

function render(){
  const app=document.getElementById("app");
  const v=S.view;
  app.innerHTML = v==="deck"?viewDeck() : v==="create"?viewCreate() : v==="study"?viewStudy() : v==="done"?viewDone() : viewHome();
  const f=document.getElementById("cform");
  if(f){
    f.addEventListener("submit",e=>{e.preventDefault(); generate();});
    const t=document.getElementById("topic"); t.addEventListener("input",()=>{S.create.topic=t.value;});
    const l=document.getElementById("level"); l.addEventListener("change",()=>{S.create.level=l.value;});
  }
}

function modal(html){ document.getElementById("modal").innerHTML = html ? '<div class="modal-bg" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>' : ""; }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="closemodal" && e.target!==el) return;
  if(act!=="flip" && el.closest(".card") && act!=="speak") return;
  switch(act){
    case "home": S.view="home"; S.study=null; render(); window.scrollTo(0,0); break;
    case "open": S.deckId=el.dataset.id; S.view="deck"; render(); window.scrollTo(0,0); break;
    case "backdeck": S.view=S.decks[S.deckId]?"deck":"home"; S.create.addTo=null; S.create.err=""; render(); break;
    case "new": S.create.addTo=null; S.create.err=""; S.view="create"; render(); window.scrollTo(0,0); break;
    case "more": { const d=S.decks[S.deckId]; if(!d) break; S.create.addTo=d.id; S.create.topic=d.topic||d.title; S.create.level=d.level||"HSK 1"; S.create.err=""; S.view="create"; render(); window.scrollTo(0,0); break; }
    case "topic": S.create.topic=el.dataset.v; S.create.err=""; render(); break;
    case "count": S.create.count=+el.dataset.v; render(); break;
    case "front": S.prefs.front=el.dataset.v; savePrefs(); render(); break;
    case "study": startStudy(S.deckId,false); window.scrollTo(0,0); break;
    case "cram": startStudy(S.deckId,true); window.scrollTo(0,0); break;
    case "flip": if(S.study){ S.study.flipped=!S.study.flipped; render(); } break;
    case "grade": grade(+el.dataset.g); break;
    case "quit": S.view=S.decks[S.deckId]?"deck":"home"; S.study=null; render(); break;
    case "speak": e.stopPropagation(); speak(el.dataset.text); break;
    case "delword": {
      const d=S.decks[S.deckId]; if(!d) break;
      d.cards=d.cards.filter(c=>c.id!==el.dataset.id);
      if(!d.cards.length){ removeDeck(d.id); S.view="home"; } else saveDeck(d.id);
      render(); break;
    }
    case "askdel": {
      const d=S.decks[S.deckId]; if(!d) break;
      modal('<h2>ลบ “'+esc(d.title)+'”?</h2><div class="muted">คำทั้ง '+d.cards.length+' คำและความคืบหน้าในชุดนี้จะหายไป</div><div class="row"><button class="btn" style="flex:1" data-act="closemodal">ยกเลิก</button><button class="btn primary" style="flex:1;background:var(--seal);border-color:var(--seal)" data-act="dodel">ลบ</button></div>');
      break;
    }
    case "dodel": removeDeck(S.deckId); modal(""); S.view="home"; render(); break;
    case "closemodal": modal(""); break;
    case "export": exportData(); break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="importfile" && e.target.files && e.target.files[0]) importData(e.target.files[0]);
});
document.addEventListener("keydown",e=>{
  if(S.view!=="study" || e.target.closest("input,select")) return;
  if(e.key===" "||e.key==="Enter"){ if(e.target.closest(".grade,.icon,.btn.ghost")) return; e.preventDefault(); S.study.flipped=!S.study.flipped; render(); }
  else if(S.study.flipped && /^[1-4]$/.test(e.key)) grade(+e.key-1);
});

loadLocal();
render();
})();
</script>
